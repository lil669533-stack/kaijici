<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>开机词 · 每天 20 词</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1d5c8f">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">词</span>
      <div class="brand-text">
        <b>开机词</b>
        <small>每天 20 个，关联着记</small>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button data-view="today" class="active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
        <span>今日</span>
      </button>
      <button data-view="review">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span>复习</span>
      </button>
      <button data-view="deck">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
        <span>词库</span>
      </button>
      <button data-view="notebook">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
        <span>生词本</span>
      </button>
      <button data-view="quiz">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
        <span>测试</span>
      </button>
      <button data-view="stats">
        <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
        <span>统计</span>
      </button>
      <button data-view="import">
        <svg viewBox="0 0 24 24"><path d="M12 4v10"/><path d="M8 10l4 4 4-4"/><path d="M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2"/></svg>
        <span>导入</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="streak-card">
        <span class="flame">🔥</span>
        <div><b id="sideStreak">0</b> 天连续</div>
        <small id="sideDue">今日待复习 0</small>
      </div>
      <button class="ghost-btn" id="themeBtn" title="切换深浅色">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <span>外观</span>
      </button>
    </div>
  </aside>

  <main class="main" id="app"></main>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
